<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="The requested Dig It page could not be found.">
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="stylesheet" href="/style/base.css">
  <title>Page Not Found | Dig It</title>
</head>
<body>
  <div class="page">
    <div class="container">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Dig It home">
          <img src="/images/app-icon.png" alt="Dig It app icon">
          <span>Dig It</span>
        </a>
      </header>
      <main>
        <section class="section article-body">
          <p class="kicker">404</p>
          <h1>Page not found</h1>
          <p class="lead">The page may have moved or the address may be incorrect.</p>
          <div class="actions">
            <a class="button primary" href="/">Go to the Dig It homepage</a>
            <a class="button" href="/help">Open help</a>
          </div>
        </section>
      </main>
      <footer class="footer">Dig It - local video keyframes and still image export.</footer>
    </div>
  </div>
</body>
</html>
